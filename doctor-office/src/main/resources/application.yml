server:
  port: 8080

spring:
  application:
    name: "DoctorOffice"
  datasource:
    url: jdbc:postgresql://localhost:5433/doctor_office
    username: postgres
    password: dhia
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  web:
    resources:
      add-mappings: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html